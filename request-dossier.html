<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Investments Puglia</title>
<script>
  /* Su Investments Puglia il dossier non si richiede online: il contatto è l'agente titolare del mandato,
     indicato nella scheda dell'immobile. Chi arriva qui da un vecchio link viene riportato alla scheda. */
  (function(){
    var id = new URLSearchParams(location.search).get("id");
    location.replace(id ? "opportunity.html?id=" + encodeURIComponent(id) : "opportunities.html");
  })();
</script>
</head>
<body></body>
</html>
